      </div>

      <div class="zone-red rounded-2xl p-4 flex flex-col items-center justify-center">
       <p class="text-white font-bold mb-2" id="zone-red-name">Merah</p>
       <div id="zone-red-options" class="space-y-2 w-full"></div>
       <div id="zone-red-score" class="mt-3 text-white/80 font-medium">
        0
       </div>
      </div>
      <div class="zone-blue rounded-2xl p-4 flex flex-col items-center justify-center">
       <p class="text-white font-bold mb-2" id="zone-blue-name">Biru</p>
       <div id="zone-blue-options" class="space-y-2 w-full"></div>
       <div id="zone-blue-score" class="mt-3 text-white/80 font-medium">
        0
       </div>
      </div>
      <div class="zone-green rounded-2xl p-4 flex flex-col items-center justify-center">
       <p class="text-white font-bold mb-2" id="zone-green-name">Hijau</p>
       <div id="zone-green-options" class="space-y-2 w-full"></div>
       <div id="zone-green-score" class="mt-3 text-white/80 font-medium">
        0
       </div>
      </div>
      <div class="zone-yellow rounded-2xl p-4 flex flex-col items-center justify-center">
       <p class="text-white font-bold mb-2" id="zone-yellow-name">Kuning</p>
       <div id="zone-yellow-options" class="space-y-2 w-full"></div>
       <div id="zone-yellow-score" class="mt-3 text-white/80 font-medium">
        0
       </div>
      </div>
     </div>

     <div class="text-center mb-4">

      <p class="text-gray-500 text-sm mt-1">Sentuh nama di kiri, lalu sentuh arti yang sesuai di kanan</p>

     <div id="dd-feedback" class="text-center mt-6 font-bold text-lg"></div>

    </div><!-- Result -->
    <div id="quiz-result" class="hidden text-center card-material max-w-2xl mx-auto"><img data-template-id="trophy-img" class="canva-image w-32 h-32 object-cover rounded-full mx-auto mb-4" loading="lazy">
     <h3 data-template-id="quiz-result-title" class="canva-text font-heading text-2xl mb-4"></h3>
     <div id="final-scores" class="space-y-3 mb-6"></div><button onclick="resetQuiz()" data-template-id="quiz-replay-btn" class="canva-button px-8 py-3 rounded-xl font-bold text-white"></button>
    </div>
   </section><!-- SKOR -->
   <section id="sec-skor" class="hidden slide-in">
    <button type="button" onclick="showSection('home')" class="mb-5 inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-indigo-400 to-purple-500 px-5 py-2.5 font-bold text-white shadow-md hover:scale-105 transition"><i data-lucide="home" style="width:18px;height:18px"></i> Kembali ke Beranda</button>
    <h2 data-template-id="skor-title" class="canva-text font-heading text-2xl mb-6"></h2>
    <div id="score-list" class="space-y-3 max-w-2xl mx-auto">
     <p data-template-id="skor-empty" class="canva-text text-gray-500 text-center py-8"></p>
    </div>
   </section>
  </main>
  <script src="/_sdk/d97541380e824b1a.editing_sdk.js" integrity="sha512-iBVkuiyctyjmaqUwrsoYSc/nxwymdEKZMKPeBCNj6uN/7hFPTiMVeunYJjJVnUh1GNECKEyCerl7IHtlqhzSYQ=="></script>
  <script src="/_sdk/0e8d3a91e1c6f495.data_sdk.js" integrity="sha512-c00oDoGjsMgluCLLEyVl3suwEkgjOGGplVFbsilUoBg4aMKNmsL3mwsc9r0dPn95qiSZyjBousQXgROkAW7p/w=="></script>
  <script>
        // Navigation
        function showSection(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            const sec = document.getElementById('sec-' + id);
            if (sec) { sec.classList.remove('hidden'); sec.classList.add('slide-in'); }
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const navBtn = document.querySelector(`[data-nav="${id}"]`);
            if (navBtn) navBtn.classList.add('active');
        }

        // ========== MULTIPLAYER QUIZ ==========
        const multiQuestions = [
            { q: "Apa arti Al-Halīm?", options: ["Maha Penyabar", "Maha Penyayang", "Maha Bijaksana", "Maha Pengasih"], answer: 0 },
            { q: "Asy-Syakūr artinya...", options: ["Maha Kaya", "Maha Berterima Kasih", "Maha Perkasa", "Maha Adil"], answer: 1 },
            { q: "Al-Hakīm berarti...", options: ["Maha Pengampun", "Maha Besar", "Maha Bijaksana", "Maha Kuasa"], answer: 2 },
            { q: "Al-Wadūd artinya...", options: ["Maha Pencinta", "Maha Pemberi", "Maha Penyembuh", "Maha Penolong"], answer: 0 },
            { q: "Allah tidak segera menghukum hamba yang berdosa. Ini mencerminkan sifat...", options: ["Al-Hakīm", "Al-Halīm", "Asy-Syakūr", "Al-Wadūd"], answer: 1 }
        ];

        let players = { red:{name:'',score:0}, blue:{name:'',score:0}, green:{name:'',score:0}, yellow:{name:'',score:0} };
        let currentQ = 0, timer = null, answered = {};

        function startQuizType(type) {
            document.getElementById('quiz-type-select').classList.add('hidden');
            if (type === 'multiplayer') {
                document.getElementById('quiz-setup').classList.remove('hidden');
            } else if (type === 'dragdrop') {
                document.getElementById('quiz-dragdrop').classList.remove('hidden');
                initDragDrop();
            } else if (type === 'shortanswer') {
                document.getElementById('quiz-shortanswer').classList.remove('hidden');
                initShortAnswer();
            } else if (type === 'truefalse') {
                document.getElementById('quiz-truefalse').classList.remove('hidden');
                initTrueFalse();
            }
        }

        function startMultiplayer() {
            players.red.name = document.getElementById('player-red').value || 'Merah';
            players.blue.name = document.getElementById('player-blue').value || 'Biru';
            players.green.name = document.getElementById('player-green').value || 'Hijau';
            players.yellow.name = document.getElementById('player-yellow').value || 'Kuning';
            players.red.score=0; players.blue.score=0; players.green.score=0; players.yellow.score=0;
            currentQ = 0;
            document.getElementById('quiz-setup').classList.add('hidden');
            document.getElementById('quiz-game').classList.remove('hidden');
            document.getElementById('zone-red-name').textContent = players.red.name;
            document.getElementById('zone-blue-name').textContent = players.blue.name;
            document.getElementById('zone-green-name').textContent = players.green.name;
            document.getElementById('zone-yellow-name').textContent = players.yellow.name;
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQ >= multiQuestions.length) { endMultiplayer(); return; }
            answered = {};
            const q = multiQuestions[currentQ];
            document.getElementById('q-num').textContent = currentQ + 1;
            document.getElementById('q-text').textContent = q.q;
            ['red','blue','green','yellow'].forEach(color => {
                const container = document.getElementById(`zone-${color}-options`);
                container.innerHTML = '';
                q.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option w-full py-2 px-3 bg-white/90 rounded-lg text-sm font-medium text-gray-800 hover:bg-white';
                    btn.textContent = opt;
                    btn.onclick = () => handleAnswer(color, i, btn);
                    container.appendChild(btn);
                });
                document.getElementById(`zone-${color}-score`).textContent = players[color].score;
            });
            startTimer();
        }

        function startTimer() {
            let t = 10;
            document.getElementById('q-timer').textContent = t;
            clearInterval(timer);
            timer = setInterval(() => {
                t--;
                document.getElementById('q-timer').textContent = t;
                if (t <= 0) { clearInterval(timer); currentQ++; loadQuestion(); }
            }, 1000);
        }

        function handleAnswer(color, idx, btn) {
            if (answered[color]) return;
            answered[color] = true;
            const correct = multiQuestions[currentQ].answer === idx;
            if (correct) {
                players[color].score += 10;
                btn.classList.add('correct-flash');
                btn.style.background = '#bbf7d0';
            } else {
                btn.classList.add('wrong-flash');
                btn.style.background = '#fecaca';
            }
            document.getElementById(`zone-${color}-score`).textContent = players[color].score;
            document.getElementById(`zone-${color}-options`).querySelectorAll('button').forEach(b => b.disabled = true);
            if (Object.keys(answered).length === 4) { clearInterval(timer); setTimeout(() => { currentQ++; loadQuestion(); }, 1200); }
        }

        async function endMultiplayer() {
            document.getElementById('quiz-game').classList.add('hidden');
            document.getElementById('quiz-result').classList.remove('hidden');
            const sorted = Object.entries(players).sort((a,b) => b[1].score - a[1].score);
            const container = document.getElementById('final-scores');
            container.innerHTML = '';
            const colors = { red:'bg-red-100 text-red-800', blue:'bg-blue-100 text-blue-800', green:'bg-green-100 text-green-800', yellow:'bg-yellow-100 text-yellow-800' };
            sorted.forEach(([c, p], i) => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between px-4 py-3 rounded-lg ${colors[c]}`;
                div.innerHTML = `<span class="font-bold">${i+1}. ${p.name}</span><span class="font-bold">${p.score} poin</span>`;
                container.appendChild(div);
            });
            const dateStr = new Date().toISOString();
            for (const [c, p] of Object.entries(players)) {
                if (p.name && p.score > 0) {
                    await window.dataSdk.create({ player_name: p.name, zone_color: c, score: p.score, quiz_date: dateStr });
                }
            }
        }

        // ========== DRAG & DROP QUIZ ==========
        const ddData = [
            { left: "Al-Halīm", right: "Maha Penyabar" },
            { left: "Asy-Syakūr", right: "Maha Berterima Kasih" },
            { left: "Al-Hakīm", right: "Maha Bijaksana" },
            { left: "Al-Wadūd", right: "Maha Pencinta" },
            { left: "Al-Ghafūr", right: "Maha Pengampun" }
        ];
        let ddSelected = null, ddMatched = 0;

        function initDragDrop() {
            ddSelected = null; ddMatched = 0;
            const container = document.getElementById('dd-container');
            const feedback = document.getElementById('dd-feedback');
            feedback.textContent = '';
            const shuffledRight = [...ddData].sort(() => Math.random() - 0.5);
            container.innerHTML = `
                <div class="space-y-4" id="dd-left">${ddData.map((d,i) => `<div class="match-item bg-emerald-50 rounded-xl p-4 text-center font-bold text-lg text-emerald-800" data-dd-left="${i}" onclick="ddSelectLeft(${i})">${d.left}</div>`).join('')}</div>
                <div class="space-y-4" id="dd-right">${shuffledRight.map((d,i) => `<div class="match-item bg-amber-50 rounded-xl p-4 text-center font-medium text-amber-800" data-dd-right="${ddData.indexOf(d)}" onclick="ddSelectRight(${ddData.indexOf(d)})">${d.right}</div>`).join('')}</div>
            `;
        }

        function ddSelectLeft(idx) {
            document.querySelectorAll('[data-dd-left]').forEach(el => el.classList.remove('selected'));
            const el = document.querySelector(`[data-dd-left="${idx}"]`);
            if (el.classList.contains('matched')) return;
            el.classList.add('selected');
            ddSelected = idx;
        }

        function ddSelectRight(idx) {
            if (ddSelected === null) return;
            const rightEl = document.querySelector(`[data-dd-right="${idx}"]`);
            const leftEl = document.querySelector(`[data-dd-left="${ddSelected}"]`);
            if (rightEl.classList.contains('matched')) return;
            if (ddSelected === idx) {
                leftEl.classList.remove('selected');
                leftEl.classList.add('matched');
                rightEl.classList.add('matched');
                ddMatched++;
                if (ddMatched === ddData.length) {
                    document.getElementById('dd-feedback').innerHTML = '<span class="text-emerald-600">🎉 Semua cocok! Kamu hebat!</span>';
                }
            } else {
                rightEl.classList.add('wrong-match');
                leftEl.classList.add('wrong-match');
                setTimeout(() => {
                    rightEl.classList.remove('wrong-match');
                    leftEl.classList.remove('wrong-match');
                    leftEl.classList.remove('selected');
                }, 600);
            }
            ddSelected = null;
        }

        // ========== CASE STUDY QUIZ ==========
        const csData = [
            { scenario: "Rina tidak sengaja menumpahkan air ke buku Ahmad. Ahmad tidak marah dan berkata: 'Tidak apa-apa, lain kali hati-hati ya.' Ahmad sedang meneladani sifat...", options: ["Al-Halīm","Asy-Syakūr","Al-Hakīm","Al-Wadūd"], answer: 0, explanation: "Ahmad menahan amarah dan bersabar — ini meneladani sifat Al-Halīm (Maha Penyabar)." },
            { scenario: "Setelah mendapat nilai bagus, Siti langsung mengucapkan 'Alhamdulillah' dan berterima kasih kepada gurunya yang sudah mengajar dengan sabar. Siti meneladani sifat...", options: ["Al-Halīm","Asy-Syakūr","Al-Hakīm","Al-Wadūd"], answer: 1, explanation: "Siti bersyukur atas nikmat dan menghargai kebaikan orang lain — meneladani Asy-Syakūr (Maha Berterima Kasih)." },
            { scenario: "Budi ingin membeli mainan baru, tapi ia memilih menabung uangnya untuk membeli buku pelajaran yang lebih bermanfaat. Budi meneladani sifat...", options: ["Al-Halīm","Asy-Syakūr","Al-Hakīm","Al-Wadūd"], answer: 2, explanation: "Budi membuat keputusan bijak dengan mempertimbangkan manfaat jangka panjang — meneladani Al-Hakīm (Maha Bijaksana)." }
        ];
        let csIndex = 0;

        function initCaseStudy() {
            csIndex = 0;
            renderCS();
        }

        function renderCS() {
            const container = document.getElementById('cs-container');
            if (csIndex >= csData.length) {
                container.innerHTML = '<div class="card-material text-center"><p class="text-2xl mb-2">🎉</p><p class="font-bold text-lg text-emerald-700">Semua studi kasus selesai!</p></div>';
                return;
            }
            const cs = csData[csIndex];
            container.innerHTML = `
                <div class="card-material">
                    <div class="flex items-center gap-2 mb-4"><span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-sm font-bold">Kasus ${csIndex+1}/${csData.length}</span></div>
                    <p class="text-lg text-gray-800 mb-6 leading-relaxed">${cs.scenario}</p>
                    <div class="grid grid-cols-2 gap-3" id="cs-options">
                        ${cs.options.map((opt,i) => `<button class="bs-option p-4 rounded-xl bg-gray-50 border-2 border-gray-200 font-medium text-gray-700 text-left" onclick="answerCS(${i})">${opt}</button>`).join('')}
                    </div>
                    <div id="cs-explanation" class="hidden mt-6 p-4 rounded-xl bg-blue-50 border-l-4 border-blue-400 text-gray-700"></div>
                </div>
            `;
        }

        function answerCS(idx) {
            const cs = csData[csIndex];
            const btns = document.querySelectorAll('#cs-options button');
            btns.forEach((b,i) => {
                b.disabled = true;
                if (i === cs.answer) { b.classList.add('correct-flash'); b.style.borderColor = '#22c55e'; b.style.background = '#f0fdf4'; }
                else if (i === idx && idx !== cs.answer) { b.classList.add('wrong-flash'); b.style.borderColor = '#ef4444'; b.style.background = '#fef2f2'; }
            });
            const expl = document.getElementById('cs-explanation');
            expl.classList.remove('hidden');
            expl.innerHTML = `<strong>${idx === cs.answer ? '✅ Benar!' : '❌ Kurang tepat.'}</strong> ${cs.explanation}`;
            setTimeout(() => { csIndex++; renderCS(); }, 3000);
        }

        // ========== SHORT ANSWER QUIZ ==========
        const saData = [
            { question: "Al-Halīm berarti Allah Maha ____.", answers: ["penyabar", "penyantun"] },
            { question: "Asy-Syakūr berarti Allah Maha ____ kebaikan hamba-Nya.", answers: ["mensyukuri", "berterima kasih"] },
            { question: "Al-Hakīm berarti Allah Maha ____.", answers: ["bijaksana"] },
            { question: "Al-Wadūd berarti Allah Maha ____.", answers: ["pencinta", "mengasihi"] },
            { question: "Sikap berterima kasih atas nikmat Allah disebut ____.", answers: ["syukur", "bersyukur"] }
        ];
        let saIndex = 0;
        function initShortAnswer() { saIndex = 0; renderShortAnswer(); }
        function renderShortAnswer() {
            const container = document.getElementById('sa-container');
            if (saIndex >= saData.length) { container.innerHTML = '<div class="card-material text-center"><p class="font-bold text-lg text-emerald-700">🎉 Semua isian selesai!</p></div>'; return; }
            const item = saData[saIndex];
            container.innerHTML = `<div class="card-material"><div class="mb-4 font-bold text-emerald-700">Soal ${saIndex + 1}/5</div><p class="text-lg text-gray-800 mb-5">${item.question}</p><form onsubmit="answerShortAnswer(event)"><label for="short-answer-input" class="sr-only">Jawaban singkat</label><input id="short-answer-input" required autocomplete="off" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 mb-4" placeholder="Ketik jawabanmu..."><button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 text-white font-bold">Periksa Jawaban</button></form><div id="sa-feedback" class="hidden mt-5 p-4 rounded-xl bg-blue-50 text-gray-700"></div></div>`;
        }
        function answerShortAnswer(event) {
            event.preventDefault();
            const input = document.getElementById('short-answer-input');
            const answer = input.value.trim().toLowerCase();
            const correct = saData[saIndex].answers.includes(answer);
            input.disabled = true;
            document.querySelector('#sa-container button').disabled = true;
            const feedback = document.getElementById('sa-feedback');
            feedback.classList.remove('hidden');
            feedback.innerHTML = `<strong>${correct ? '✅ Benar!' : '❌ Belum tepat.'}</strong> Jawaban yang tepat: ${saData[saIndex].answers[0]}.`;
            setTimeout(() => { saIndex++; renderShortAnswer(); }, 2200);
        }

        // ========== TRUE/FALSE QUIZ ==========
        const tfData = [
            { statement: "Al-Halīm berarti Allah tidak mampu menghukum hamba-Nya yang berdosa.", answer: false, explanation: "SALAH. Al-Halīm bukan berarti Allah tidak mampu menghukum, melainkan Allah memilih untuk menunda hukuman dan memberi kesempatan bertaubat karena kasih sayang-Nya." },
            { statement: "Asy-Syakūr berarti Allah membalas kebaikan hamba-Nya dengan pahala yang berlipat ganda.", answer: true, explanation: "BENAR. Allah Asy-Syakūr membalas amal kebaikan sekecil apa pun dengan pahala yang berlipat ganda, bahkan melebihi apa yang pantas diterima." },
            { statement: "Al-Wadūd hanya berarti Allah mencintai, tetapi tidak berarti Allah dicintai oleh hamba-Nya.", answer: false, explanation: "SALAH. Al-Wadūd bermakna dua arah: Allah Maha Mencintai hamba-Nya DAN Maha Dicintai oleh hamba-hamba-Nya yang beriman." },
            { statement: "Al-Hakīm mengajarkan kita untuk berpikir bijak sebelum bertindak.", answer: true, explanation: "BENAR. Meneladani Al-Hakīm berarti mengambil keputusan dengan pertimbangan yang baik." },
            { statement: "Bersyukur hanya perlu dilakukan ketika mendapat hadiah besar.", answer: false, explanation: "SALAH. Kita perlu bersyukur atas setiap nikmat, termasuk nikmat kecil setiap hari." }
        ];
        let tfIndex = 0;

        function initTrueFalse() {
            tfIndex = 0;
            renderTF();
        }

        function renderTF() {
            const container = document.getElementById('tf-container');
            if (tfIndex >= tfData.length) {
                container.innerHTML = '<div class="card-material text-center"><p class="text-2xl mb-2">🎉</p><p class="font-bold text-lg text-emerald-700">Semua pernyataan selesai!</p></div>';
                return;
            }
            const tf = tfData[tfIndex];
            container.innerHTML = `
                <div class="card-material">
                    <div class="flex items-center gap-2 mb-4"><span class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-sm font-bold">Pernyataan ${tfIndex+1}/${tfData.length}</span></div>
                    <p class="text-lg text-gray-800 mb-6 leading-relaxed font-medium">"${tf.statement}"</p>
                    <div class="flex gap-4" id="tf-buttons">
                        <button onclick="answerTF(true)" class="flex-1 py-4 rounded-xl bg-emerald-50 border-2 border-emerald-200 font-bold text-emerald-700 text-lg hover:bg-emerald-100 transition">✅ BENAR</button>
                        <button onclick="answerTF(false)" class="flex-1 py-4 rounded-xl bg-red-50 border-2 border-red-200 font-bold text-red-700 text-lg hover:bg-red-100 transition">❌ SALAH</button>
                    </div>
                    <div id="tf-explanation" class="hidden mt-6 p-4 rounded-xl bg-blue-50 border-l-4 border-blue-400 text-gray-700"></div>
                </div>
            `;
        }

        function answerTF(val) {
            const tf = tfData[tfIndex];
            const btns = document.querySelectorAll('#tf-buttons button');
            btns.forEach(b => b.disabled = true);
            const correct = val === tf.answer;
            const expl = document.getElementById('tf-explanation');
            expl.classList.remove('hidden');
            expl.innerHTML = `<strong>${correct ? '✅ Jawaban kamu benar!' : '❌ Jawaban kamu kurang tepat.'}</strong><br>${tf.explanation}`;
            setTimeout(() => { tfIndex++; renderTF(); }, 3500);
        }

        // ========== RESET ==========
        function resetQuiz() {
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-game').classList.add('hidden');
            document.getElementById('quiz-setup').classList.add('hidden');
            document.getElementById('quiz-dragdrop').classList.add('hidden');
            document.getElementById('quiz-shortanswer').classList.add('hidden');
            document.getElementById('quiz-truefalse').classList.add('hidden');
            document.getElementById('quiz-type-select').classList.remove('hidden');
        }

        // ========== DATA SDK ==========
        let allScores = [];
        const dataHandler = {
            onDataChanged(data) {
                allScores = data;
                renderScoreboard();
            }
        };

        function renderScoreboard() {
            const container = document.getElementById('score-list');
            const emptyMsg = container.querySelector('[data-template-id="skor-empty"]');
            if (allScores.length === 0) { if(emptyMsg) emptyMsg.classList.remove('hidden'); return; }
            if(emptyMsg) emptyMsg.classList.add('hidden');
            [...container.children].forEach(c => { if(!c.hasAttribute('data-template-id')) c.remove(); });
            const sorted = [...allScores].sort((a,b) => (b.score||0) - (a.score||0));
            sorted.slice(0, 20).forEach((row, i) => {
                let el = container.querySelector(`[data-row-id="${row.__backendId}"]`);
                if (!el) {
                    el = document.createElement('div');
                    el.setAttribute('data-row-id', row.__backendId);
                    el.className = 'flex items-center justify-between bg-white rounded-lg px-5 py-3 shadow-sm';
                    container.appendChild(el);
                }
                const colorBadge = { red:'bg-red-500', blue:'bg-blue-500', green:'bg-green-500', yellow:'bg-yellow-400' };
                el.innerHTML = `<div class="flex items-center gap-3"><span class="font-bold text-gray-500 w-6">${i+1}</span><span class="w-4 h-4 rounded-full ${colorBadge[row.zone_color]||'bg-gray-300'}"></span><span class="font-medium">${row.player_name}</span></div><span class="font-bold text-emerald-600">${row.score} poin</span>`;
            });
        }

        (async function() {
            const res = await window.dataSdk.init(dataHandler);
            if (!res.isOk) { /* silent */ }
        })();

        lucide.createIcons();
    </script>
 </body>
</html>
